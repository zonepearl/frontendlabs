# Pull-request gate. The "e2e" check is required by the main-branch ruleset
# (.github/rulesets/main-branch.json): nothing merges into main unless the site
# builds, every link resolves, and the E2E suite passes.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/guides build
      - run: python3 scripts/checklinks.py dist https://frontendlabs.xyz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot comparisons (@visual) use macOS baselines; the pre-commit hook runs them.
      - run: npx playwright test --grep-invert @visual
        env:
          CI: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
