# Pull-request gate. The "e2e" check is required by the main-branch ruleset
# (.github/rulesets/main-branch.json): nothing merges into main unless the site
# builds, every link resolves, and the E2E suite passes.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/guides build
      - run: python3 scripts/checklinks.py dist https://frontendlabs.xyz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot comparisons (@visual) use macOS baselines; the pre-commit hook runs them.
      - run: npx playwright test --grep-invert @visual
        env:
          CI: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
