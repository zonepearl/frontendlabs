# GitHub Pages: build dist/ from the committed docs/, check links and the E2E
# suite, publish. Runs only for main, which the main-branch ruleset protects
# (changes arrive through pull requests that passed the "e2e" check in ci.yml).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the deploy job gets Pages and OIDC rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/guides build
      - run: python3 scripts/checklinks.py dist https://frontendlabs.xyz
      # E2E gate: layout, style and content must pass before anything deploys.
      # Screenshot comparisons (@visual) are skipped here: their baselines are
      # macOS renders, and Linux fonts differ. The local pre-commit hook runs them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @visual
        env:
          CI: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
