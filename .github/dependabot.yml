# Dependabot: security and version updates arrive as pull requests, which must
# pass the required "e2e" check like any other change.
version: 2
updates:
  - package-ecosystem: github-actions   # also bumps the pinned commit SHAs in workflows
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm               # Tailwind and Playwright (dev only)
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-dev: { patterns: ["*"] }
  - package-ecosystem: gomod             # the site generator
    directory: /
    schedule: { interval: weekly }
